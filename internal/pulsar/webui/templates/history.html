{{define "content"}}
<div class="space-y-6">
  <div>
    <p class="text-xs font-mono uppercase tracking-widest text-primary">Scrobbles</p>
    <h1 class="mt-1 text-2xl sm:text-3xl font-bold tracking-tight">Playback History</h1>
    <p class="mt-1 text-sm text-[var(--console-dim)]">Browse your scrobbles, filter by media domain, and link entries to canonical catalog items.</p>
  </div>

  {{if .CurrentUser}}
  <div data-island="history-manager"></div>
  {{else}}
  <div class="rounded-2xl bg-base-200 p-8 text-center space-y-4">
    <p class="text-sm text-[var(--console-dim)]">Sign in to view and manage your playback history.</p>
    <a href="{{.SignInURL}}" class="btn btn-primary btn-sm rounded-xl">Sign in with Solarpass</a>
  </div>
  {{end}}
</div>
{{end}}
