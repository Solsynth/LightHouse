{{define "content"}}
<div class="space-y-6">
  <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4">
    <div>
      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Catalog &amp; Creators</h1>
      <p class="text-sm text-[var(--console-dim)] mt-1">Browse tracked works, discover creators, or register custom entries.</p>
    </div>
  </div>
  <div data-island="catalog-browser" data-props='{{json (dict "signedIn" (ne .CurrentUser nil))}}'></div>
</div>
{{end}}
