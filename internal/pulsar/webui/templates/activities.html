{{define "content"}}
<div class="mx-auto max-w-4xl space-y-6">
  <div>
    <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Activities &amp; Live Sessions</h1>
    <p class="text-sm text-[var(--console-dim)] mt-1">Broadcast what you are listening to, watching, playing, or reading right now.</p>
  </div>
  {{if .CurrentUser}}
  <div data-island="activities-panel"></div>
  {{else}}
  <div class="rounded-2xl bg-base-200 p-8 text-center space-y-3">
    <p class="text-sm text-[var(--console-dim)]">Sign in to manage active sessions and broadcast activities.</p>
    <a href="{{.SignInURL}}" class="btn btn-primary btn-sm rounded-xl">Sign in</a>
  </div>
  {{end}}
</div>
{{end}}
