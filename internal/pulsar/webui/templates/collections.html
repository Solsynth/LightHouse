{{define "content"}}
<div class="space-y-6">
  <div>
    <p class="text-xs font-mono uppercase tracking-widest text-primary">Library</p>
    <h1 class="mt-1 text-2xl sm:text-3xl font-bold tracking-tight">Collections &amp; Favourites</h1>
    <p class="mt-1 text-sm text-[var(--console-dim)]">Curate playlists, watchlists, backlogs, and favourite items across all media domains.</p>
  </div>

  {{if .CurrentUser}}
  <div data-island="collections-manager"></div>
  {{else}}
  <div class="rounded-2xl bg-base-200 p-8 text-center space-y-4">
    <p class="text-sm text-[var(--console-dim)]">Sign in to manage your collections and favourites.</p>
    <a href="{{.SignInURL}}" class="btn btn-primary btn-sm rounded-xl">Sign in with Solarpass</a>
  </div>
  {{end}}
</div>
{{end}}
