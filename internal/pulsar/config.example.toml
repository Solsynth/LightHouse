siteUrl = "http://localhost:5173"
baseUrl = "http://localhost:5073"

[http]
port = "5073"

[grpc]
port = "7101"
useTLS = false

[database]
dsn = "postgres://postgres:postgres@localhost:5432/dyson_pulsar?sslmode=disable"

[redis]
addr = "localhost:6379"
password = ""
db = 0

[nats]
target = "nats://localhost:4222"
websocketPushSubject = "websocket_push"

[services]
stargate = { grpc = "localhost:9090" }
blade    = { grpc = "localhost:7001" }

[metadata]
# Sent to every upstream provider. This value names Pulsar and carries the
# fleet's contact URL, which MusicBrainz's terms and Bangumi's client guidance
# require.
userAgent = "Pulsar/1.0 (https://solsynth.dev; lily@solsynth.dev)"
# Upstream endpoints. Point one at a mirror or a local test server when
# needed; an empty value falls back to the provider's public default.
musicBrainzBaseUrl = "https://musicbrainz.org"
musicBrainzCoverArtUrl = "https://coverartarchive.org"
anilistEndpoint = "https://graphql.anilist.co"
steamBaseUrl = "https://store.steampowered.com"
# Bangumi answers for anime, manga/books, games and live-action video. The API
# is public; an access token is optional and only raises quotas. Create one at
# https://bgm.tv/dev/app if the deployment needs it.
bangumiBaseUrl = "https://api.bgm.tv"
bangumiAccessToken = ""
tmdbBaseUrl = "https://api.themoviedb.org/3"
# TMDb API key for movie and TV search. Without it the video domain searches
# only the locally cached catalog.
tmdbApiKey = ""

[lyrics]
# LRCLIB's public API. GroovyBox asks Pulsar instead of calling it directly, so
# the shared rate limit lives in one place; point this at a mirror if needed.
lrclibBaseUrl = "https://lrclib.net"
# Persona's gateway base, including the /persona prefix. Empty disables
# model-backed lyric translation through Pulsar (clients fall back to Google).
personaBaseUrl = ""
# Sent to both upstreams. Empty reuses metadata.userAgent.
userAgent = ""

[bangumi]
# The Bangumi account link itself is owned by Stargate (see [oidc.bangumi]
# there). Pulsar only reads the collection API with the token Stargate hands
# it, so no client secret belongs in this file.
apiBaseUrl = "https://api.bgm.tv"
# Empty reuses metadata.userAgent.
userAgent = ""
# Minutes between background reconciliations. Zero means 30; a negative
# value disables the background job while leaving manual sync available.
syncIntervalMinutes = 30
# When both sides changed since the last agreement: local, remote or newest.
conflictPolicy = "remote"

[discovery]
enabled = false
target = "localhost:7001"
service = "pulsar"

[scrobbler]
autoScrobbleThresholdPercent = 50
autoScrobbleMinSeconds = 240
maxBatchScrobble = 50

[librarySync]
# GroovyBox's per-account music library mirror (tracks, source links, lyrics,
# play events, session and settings documents). Tombstones stay visible to
# pulls for this long, then the purge job removes them.
retentionDays = 90
# Caps one push request and one pull page.
maxBatch = 500
# Local-development switch: a non-empty value names a request header whose UUID
# value is trusted as the account id. This bypasses fleet auth ENTIRELY; it must
# stay empty in any deployed config.
devAccountHeader = ""

[security]
trustedProxyHops = 1
maxTake = 100

[web]
# Built Vue islands bundle (web/dist). Docker image ships it at /app/web/dist.
distPath = "web/dist"
# Optional Vite dev server URL for local SSR + HMR development.
devViteUrl = ""
# Optional Stargate base URL for sign-in links (empty uses same-origin /sign-in).
stargateUrl = ""
