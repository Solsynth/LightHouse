siteUrl = "http://localhost:3000"
baseUrl = "http://localhost:5072"

[http]
port = "5072"

[grpc]
port = "7100"
useTLS = false
# certFile = "Keys/server.crt"
# keyFile = "Keys/server.key"

[database]
dsn = "host=localhost port=5432 user=postgres password=postgres dbname=dyson_messager sslmode=disable"

[redis]
addr = ""
password = ""
db = 0

[nats]
target = ""
websocketPushSubject = "websocket_push"

# Inbound bearer tokens are validated by Stargate's DyAuthService over gRPC.
[services]
# Stargate serves auth, permissions, accounts, action logs, presence, MLS,
# profiles, realms and domain blocks.
stargate = { grpc = "" }
# Sphere is only needed for survey stickers, link previews and autocompletion.
sphere = { grpc = "" }
ring = { grpc = "" }
drive = { grpc = "" }
wallet = { grpc = "" }
develop = { grpc = "" }
blade = { grpc = "" }

[modules]
enabled = []
disabled = []

[realtimeChat]
endpoint = ""
apiKey = ""
apiSecret = ""

[voiceMessages]
keyPrefix = "voice"
maxFileSizeBytes = 10485760
retentionDays = 30
cleanupCron = "0 15 * * * ?"

[voiceMessages.s3]
serviceUrl = ""
endpoint = ""
publicBaseUrl = ""
region = "us-east-1"
accessKey = ""
secretKey = ""
bucket = ""
forcePathStyle = true
enableSsl = true

[security]
trustedProxyHops = 1
maxTake = 100

[discovery]
enabled = false
target = "blade:7001"
registrationToken = ""
service = "messager"
instanceId = ""
httpEndpoint = ""
grpcEndpoint = ""
leaseSeconds = 30
weight = 1
