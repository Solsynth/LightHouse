name: Metoer image

on:
  push:
    branches: [master]
    paths:
      - "internal/metoer/**"
      - "shared/**"
      - ".github/workflows/metoer.yml"
  pull_request:
    branches: [master]
    paths:
      - "internal/metoer/**"
      - "shared/**"
      - ".github/workflows/metoer.yml"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ vars.PACKAGE_OWNER }}/lighthouse-metoer

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
          cache-dependency-path: internal/metoer/go.sum

      # Outside the workspace, exactly how the image builds it.
      - name: Vet
        run: GOWORK=off go vet ./...
        working-directory: internal/metoer

      - name: Test
        run: GOWORK=off go test ./...
        working-directory: internal/metoer

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          # Context is the child module: the image never sees go.work.
          context: ./internal/metoer
          file: ./internal/metoer/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=metoer
          cache-to: type=gha,mode=max,scope=metoer
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
