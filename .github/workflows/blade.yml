name: Blade images

on:
  push:
    branches: [master]
    paths:
      - "blade/**"
      - ".github/workflows/blade.yml"
  pull_request:
    branches: [master]
    paths:
      - "blade/**"
      - ".github/workflows/blade.yml"

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: blade
            dockerfile: Dockerfile
          - image: blade-relay
            dockerfile: Dockerfile.relay

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # Context is the child module: the image never sees go.work.
          context: ./blade
          file: ./blade/${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ vars.PACKAGE_OWNER }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ vars.PACKAGE_OWNER }}/${{ matrix.image }}:latest
