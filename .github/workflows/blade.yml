name: Blade image

on:
  push:
    branches: [master]
    paths:
      - "internal/blade/**"
      - "shared/**"
      - ".github/workflows/blade.yml"
  pull_request:
    branches: [master]
    paths:
      - "internal/blade/**"
      - "shared/**"
      - ".github/workflows/blade.yml"

env:
  REGISTRY: ghcr.io
  # One image carries both binaries (gateway by default, `relay` as the
  # command).
  IMAGE_NAME: ${{ vars.PACKAGE_OWNER }}/lighthouse-blade

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          # Context is the child module: the image never sees go.work.
          context: ./internal/blade
          file: ./internal/blade/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          cache-from: type=gha,scope=blade
          cache-to: type=gha,mode=max,scope=blade
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
